<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 500 270" width="100%" height="100%">
  <defs>
    <style>
      .monogram {
        font-family: 'Playfair Display', 'Cinzel', Georgia, serif;
        font-size: 225px;
        font-weight: 800;
        fill: #121214;
      }
      .name-text {
        font-family: 'Playfair Display', 'Cinzel', Georgia, serif;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 0.18em;
        fill: #121214;
      }
    </style>
  </defs>
  
  <!-- Interlocking MA Monogram with Sharp Crisp Precision -->
  <g transform="translate(45, 10)">
    <!-- Letter M -->
    <text x="25" y="200" class="monogram" letter-spacing="-0.04em">M</text>
    <!-- Letter A intersecting -->
    <text x="180" y="200" class="monogram" letter-spacing="-0.04em">A</text>
    <!-- Cut line definition -->
    <line x1="188" y1="30" x2="258" y2="205" stroke="#FAF8F5" stroke-width="7" />
    <line x1="186" y1="30" x2="256" y2="205" stroke="#121214" stroke-width="2.5" />
  </g>

  <!-- Subtitle Text: MALIK ABUBAKKAR -->
  <text x="250" y="280" text-anchor="middle" class="name-text">MALIK ABUBAKKAR</text>
</svg>
